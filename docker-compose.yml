# DAX Report Designer — Server (Consumer) Mode
#
# Usage:
#   1. Place your project folder at ./my_project/ (with model/, reports/, etc.)
#   2. Run:  docker compose up                          # default (small tier)
#      or:   docker compose --profile medium up         # team deployment
#      or:   docker compose --profile large up          # multi-node (2 instances)
#   3. Open: http://localhost:8080
#
# Consumers can view reports in their browser — no install needed.

services:
  dax-server:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Mount your project folder as /data/project inside the container
      - ./sample_project:/data/project:ro
    environment:
      - DAX_SERVER_MODE=server
      - DAX_PROJECT_PATH=/data/project
      - DAX_SCALE_TIER=small
      # Optional: mount a DuckDB file
      # - DAX_DUCKDB_PATH=/data/project/sample.duckdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r=requests.get('http://localhost:8080/runtime/meta', timeout=5); assert r.status_code==200"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── Medium tier (team / department, 4 workers) ──────────────
  dax-server-medium:
    build: .
    profiles: ["medium"]
    ports:
      - "8080:8080"
    volumes:
      - ./sample_project:/data/project:ro
    environment:
      - DAX_SERVER_MODE=server
      - DAX_PROJECT_PATH=/data/project
      - DAX_SCALE_TIER=medium
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r=requests.get('http://localhost:8080/runtime/meta', timeout=5); assert r.status_code==200"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── Large tier (multi-node: 2 instances behind load balancer) ──
  dax-server-large-1:
    build: .
    profiles: ["large"]
    volumes:
      - ./sample_project:/data/project:ro
    environment:
      - DAX_SERVER_MODE=server
      - DAX_PROJECT_PATH=/data/project
      - DAX_SCALE_TIER=large
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r=requests.get('http://localhost:8080/runtime/meta', timeout=5); assert r.status_code==200"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  dax-server-large-2:
    build: .
    profiles: ["large"]
    volumes:
      - ./sample_project:/data/project:ro
    environment:
      - DAX_SERVER_MODE=server
      - DAX_PROJECT_PATH=/data/project
      - DAX_SCALE_TIER=large
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r=requests.get('http://localhost:8080/runtime/meta', timeout=5); assert r.status_code==200"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  dax-lb-large:
    image: nginx:alpine
    profiles: ["large"]
    ports:
      - "8080:80"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dax-server-large-1
      - dax-server-large-2
    restart: unless-stopped
