[pytest]
testpaths = tests
markers =
    ui: tests requiring UI dependencies (fastapi/httpx/openpyxl/plotly)
    playwright: tests requiring Playwright browser automation
    enterprise: tests for features excluded from the desktop alpha/community artifact
    power_query_live: optional live Power Query connector smoke tests requiring external profiles/tenants
    serial: tests that must not run under xdist (shared resources, fixed ports, etc.)
