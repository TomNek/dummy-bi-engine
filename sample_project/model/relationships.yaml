relationships:
- from:
    table: Sales
    column: ProductKey
  to:
    table: Product
    column: ProductKey
  active: true
  cross_filter_direction: single
  rel_id: Sales.ProductKey->Product.ProductKey
  cardinality: many_to_one
- from:
    table: Sales
    column: OrderDate
  to:
    table: DimDate
    column: Date
  active: true
  cross_filter_direction: single
  rel_id: Sales.OrderDate->DimDate.Date
