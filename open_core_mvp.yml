schema_version: 1
product:
  name: Dummy BI Engine
  audience: BI and data engineers evaluating local semantic-model migration
  promise: >
    Use the same local desktop workbench shell for projects, data, semantic
    models, DAX, reports, Plotly visuals, and tables.

workflow:
  - open_local_project
  - connect_local_data
  - inspect_tables_columns_measures_relationships
  - compile_dax_to_duckdb_sql
  - preview_data
  - build_report

data_connections:
  allowed:
    - csv
    - parquet
    - json
    - folder
    - excel
    - text
    - blob
    - duckdb
    - sqlite
    - postgres
    - mysql
    - http
    - s3
    - azure_blob
    - cloudflare_r2
    - delta
    - iceberg

visuals:
  # The community report canvas supports every Plotly visual plus table.
  allowed:
    - bar
    - column
    - line
    - area
    - scatter
    - pie
    - combo
    - histogram
    - box
    - violin
    - strip
    - ecdf
    - funnel
    - funnel_area
    - density_contour
    - density_heatmap
    - treemap
    - sunburst
    - icicle
    - scatter_polar
    - line_polar
    - bar_polar
    - bubble
    - bubble_3d
    - scatter_3d
    - line_3d
    - candlestick
    - ohlc
    - waterfall
    - gauge
    - sankey
    - table
  allowed_renderers:
    - plotly_express
    - graph_objects
    - table
  excluded_renderers:
    - svg
    - matrix
    - static
  excluded_families:
    - ibcs
    - custom_svg
    - tableau
    - power_bi_custom_visuals

ui:
  shell: shared_application_shell
  views:
    - report
    - data
    - model
  reports:
    - pages
    - filters
    - bookmarks
    - themes
    - plotly_visuals
    - table_visual

explicitly_excluded:
  - authentication_and_multi_user_server
  - subscriptions_and_scheduling
  - ml_forecasting_and_decision_intelligence
  - report_autogeneration
  - transform_studio
  - stories
  - edu_relationships
  - marketplace_and_fabric_deployment
  - pbip_and_tmdl_import
  - advanced_plotly_patch_editor
  - custom_svg_charts
  - tableau_visuals_or_import

artifact:
  frontend_entry: dax_ui/frontend/open-core/src/main.tsx
  frontend_build: npm run build:open-core
  publisher: python tools/publish_open_core_mvp.py
  validator: python tools/validate_open_core_mvp.py
