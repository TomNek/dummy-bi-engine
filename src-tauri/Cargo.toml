[package]
name = "dummy-bi-engine"
version = "0.2.1"
edition = "2021"
description = "Dummy BI Engine — desktop shell"
homepage = "https://www.dummy-bi.com/engine"
repository = "https://github.com/TomNek/dummy-bi-engine"
authors = ["Thomas"]
license = "AGPL-3.0-only"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }
