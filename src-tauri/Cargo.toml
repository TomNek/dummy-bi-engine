[package]
name = "dax-to-sql-open-core"
version = "0.1.1"
edition = "2021"
description = "Semantic Migration Workbench — desktop shell"
authors = ["Thomas"]
license = "MIT"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
