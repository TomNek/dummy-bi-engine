name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "19 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    if: github.repository == 'TomNek/dummy-bi-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            area: frontend
            paths: '["dax_ui/frontend"]'
          - language: python
            area: engine
            paths: '["dax_engine/*.py", "dax_parser", "dax_compiler.py", "semantic_model_loader.py"]'
          - language: python
            area: planner
            paths: '["dax_engine/planner"]'
          - language: python
            area: project
            paths: '["dax_project/*.py"]'
          - language: python
            area: server
            paths: '["dax_ui/server"]'
          - language: python
            area: ui-entrypoints
            paths: '["dax_ui/*.py"]'
          - language: python
            area: tooling-tests
            paths: '["tools", "tests"]'
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          # Split the interpreted code into independently uploaded databases.
          # This preserves every default security query while preventing a few
          # Python data-flow queries from exceeding CodeQL's 2 GiB result limit.
          config: |
            paths: ${{ matrix.paths }}
      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: "/language:${{ matrix.language }}/area:${{ matrix.area }}"
